name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  documentation:
    uses: ./.github/workflows/documentation.yml
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --test examples/64-yaml-recipes/index.ts
      - run: node --test examples/65-recipe-observation/index.ts
      - run: node --test examples/66-recipe-components/index.ts
      - run: node --test examples/67-recipe-harness/index.ts
      - run: node --test examples/68-recipe-workflows/index.ts
      - run: node --test examples/69-recipe-durability/index.ts
      - run: node --test examples/70-recipe-services/index.ts
      - run: node --test examples/71-recipe-speculation/index.ts
      - run: node --test examples/72-recipe-cli-dialogue/index.ts
      - run: bun run test:package
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run test:editor
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # braces <=3.0.3 (via @daytona/sdk) has no patched release yet; drop the ignore once one ships.
      - run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm
      - run: node scripts/recipe-catalog.mjs
      - run: node scripts/recipe-schemas.mjs
      - run: node scripts/recipe-native-schemas.mjs
      - run: node --test scripts/recipe-parity-path.test.mjs
      - run: node --test scripts/publish-image.test.mjs
      - run: node scripts/recipe-parity.mjs
      - run: node scripts/recipe-component-docs.mjs
      - run: node scripts/agent-capability-docs.mjs
      - run: bun run architecture
      - run: bun run typecheck
      - run: bun run format:check
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-ubuntu-latest
          path: coverage/lcov.info
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run unit and functional tests
        run: node --import ./test/setup.ts --test --test-shard=${{ matrix.shard }}/3 'test/unit/*.test.ts' 'test/functional/*.test.ts'
  redis:
    strategy:
      fail-fast: false
      matrix:
        redis: [7, 8]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:redis
  containers:
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: node test/fixtures/ci-image.ts ${{ matrix.engine }} outpost-ci:latest
      - name: Eject, build and smoke test the official harness image
        run: |
          node src/cli/main.ts image eject --image harness --engine ${{ matrix.engine }} --directory "$RUNNER_TEMP/harness-image"
          node src/cli/main.ts image build --directory "$RUNNER_TEMP/harness-image" --engine ${{ matrix.engine }} --tag outpost-harness:ci
          node scripts/image-smoke.mjs ${{ matrix.engine }} outpost-harness:ci harness
      - run: ${{ matrix.engine }} pull docker.io/library/node:24-slim
      - run: bun run build
      - run: ${{ matrix.engine }} build -t outpost-egress:ci -f images/egress/Dockerfile .
      - run: node --test test/container-egress.test.ts
        env:
          OUTPOST_CONTAINER_ENGINE: ${{ matrix.engine }}
          OUTPOST_EGRESS_IMAGE: outpost-egress:ci
      - run: bun run test:container
        env:
          OUTPOST_CONTAINER_ENGINE: ${{ matrix.engine }}
          OUTPOST_FILE_CONTAINER_IMAGE: docker.io/library/node:24-slim
      - run: printf 'hello\n' | script -qec 'node test/fixtures/container-terminal.ts' /dev/null
        env:
          OUTPOST_CONTAINER_ENGINE: ${{ matrix.engine }}
      - name: Validate built-in harness delegation and coding tools
        run: node scripts/harness-live.mjs offline ${{ matrix.engine }} coding
      - run: node test/fixtures/codex-compatible.ts
        env:
          OUTPOST_CONTAINER_ENGINE: ${{ matrix.engine }}
      - name: Validate installed file recipes on a host without Git
        if: matrix.engine == 'docker'
        run: bun run test:package
        env:
          OUTPOST_PACKAGE_CONTAINER_ENGINE: docker
      - name: Validate documentation container examples
        run: |
          ${{ matrix.engine }} tag outpost-ci:latest outpost:docs-demo
          bun run docs:test:container
        env:
          OUTPOST_DOCS_ENGINE: ${{ matrix.engine }}
