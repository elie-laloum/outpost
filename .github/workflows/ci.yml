name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run architecture
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run format:check
      - run: npm run test:package
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/lcov.info
  containers:
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node src/cli/main.ts init --yes --provider ${{ matrix.engine }} --tracker beads --image outpost-ci:latest --build
      - run: node --test test/container.test.ts
        env:
          OUTPOST_CONTAINER_ENGINE: ${{ matrix.engine }}
