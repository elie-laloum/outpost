name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  github-package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: node scripts/verify-release.mjs > "$RUNNER_TEMP/outpost-release-notes.md"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun pm pkg set repository.url=https://github.com/elie-laloum/outpost.git
      - run: bun pm pack --ignore-scripts
      - run: npm publish ./*.tgz --registry=https://npm.pkg.github.com --provenance=false --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release create "$RELEASE_TAG" ./*.tgz --title "Outpost $RELEASE_TAG" --notes-file "$RUNNER_TEMP/outpost-release-notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
  npm:
    needs: verify
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: node scripts/verify-release.mjs
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun pm pkg set repository.url=https://github.com/elie-laloum/outpost.git
      - run: bun pm pack --ignore-scripts
      - run: npm publish ./*.tgz --provenance --access public --ignore-scripts
  documentation:
    needs: [verify, github-package, npm]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.github-package.result == 'success' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: release
        run: node docs/scripts/release-channel.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.release.outputs.deploy == 'true'
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        if: steps.release.outputs.deploy == 'true'
