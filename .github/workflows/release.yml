name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  github-package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm run build
      - run: npm pkg set repository.url=https://github.com/elie-laloum/outpost.git
      - run: npm pack --ignore-scripts
      - run: npm publish ./*.tgz --registry=https://npm.pkg.github.com --provenance=false --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release create "$RELEASE_TAG" ./*.tgz --title "Outpost $RELEASE_TAG" --notes-file CHANGELOG.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
  npm:
    needs: verify
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm run build
      - run: npm pkg set repository.url=https://github.com/elie-laloum/outpost.git
      - run: npm publish --provenance --access public
