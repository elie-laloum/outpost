# yaml-language-server: $schema=../recipe-configuration.schema.json
version: 2
repository: ./repo
sandbox:
  provider: docker
  image: outpost:sandbox
branch:
  mode: integrate
agents:
  planner: { harness: codex, authentication: account }
  developer: { harness: codex, authentication: account }
  summarizer: { harness: codex, authentication: account }
transports:
  state: { type: local, directory: ./.outpost/state }
stores:
  checkpoint:
    type: transport
    transporter: { $ref: transports.state }
extensions:
  linear:
    module: ./linear-task.ts
    export: createIssueTask
    kind: callback
    contract: call.options.perform
    factory: true
    schema: { type: object, properties: {}, additionalProperties: false }
    version: "1"
  progress:
    module: ./observer.ts
    export: createProgressObserver
    kind: sink
    factory: true
    schema: { type: object, properties: {}, additionalProperties: false }
    version: "1"
functions:
  issue: { $ref: extensions.linear }
observation:
  sinks:
    - { $ref: extensions.progress }
