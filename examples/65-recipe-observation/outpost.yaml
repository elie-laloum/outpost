# yaml-language-server: $schema=../../recipe-configuration.schema.json
version: 2
repository: ../..
sandbox:
  provider: local
branch:
  mode: integrate
transports:
  runs:
    type: local
    directory: ./.outpost/storage
observation:
  type: client
  transporter: { $ref: transports.runs }
  sinks:
    - type: console
      format: json
reports:
  - type: json
