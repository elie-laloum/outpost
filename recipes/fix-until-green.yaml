# yaml-language-server: $schema=../recipe.schema.json
version: 3
name: fix-until-green
recipeVersion: "1.0.0"
description: Implement a change, run the project tests and feed failures back to the agent until they pass.
inputs:
  goal:
    type: string
    description: The change to implement.
  runner:
    type: string
    description: Package manager used to run the tests.
    default: npm
    enum: [npm, bun, pnpm, yarn]
tasks:
  - key: fix
    loop:
      maxRounds: 3
      attempt:
        agent: coder
        brief: "Implement this change and commit it: {{ inputs.goal }}"
        conversation: continue
      check:
        command:
          executable: "{{ inputs.runner }}"
          arguments: [test]
